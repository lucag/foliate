// ---------- PDF ----------
const SCALE = 2
const pdfCache = {}

// 04 + 16: invert lightness, keep hue, then map black→fg and white→bg

// pdf.js rounds boxes outward to 1/256 of the canvas: shave edge lines that are mostly paper, at full resolution
// shave edge lines that are mostly paper, at full resolution, at most `cap` px a side.
// Operator boxes: pdf.js rounds them outward by ≤ 1/256 of the canvas, so cap there and test paper colour.
// Pixel regions: snapped to the 4× grid, so cap at one cell, test paper lightness (catches anti-aliased

const DS = 4, T = 16, PAPER_TOL = 22, TRIM_LUM = 0.7

async function renderPDF(opt, theme) {

  else {
    c = recolour(p.orig, theme)
    if (opt.startsWith('smart')) {
      const r = opt === 'smart-ops' ? opBoxes(p) : opt === 'smart' ? combinedBoxes(p) : pixelBoxes(p.orig)
      const ctx = c.getContext('2d')
      for (const b of r.boxes) restore(ctx, p.orig, b, S.dim)

const chapter = b => `

  <rect x="10" y="40" width="110" height="60" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="280" y="40" width="110" height="60" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M120 70 H270" stroke="#c62828" stroke-width="3"/><path d="M270 62 L282 70 L270 78 Z" fill="#c62828"/>
  <text x="65" y="76" text-anchor="middle" font-size="16">Stone</text>
  <text x="335" y="76" text-anchor="middle" font-size="16">Peak</text>
  <text x="200" y="130" text-anchor="middle" font-size="13" fill="#1565c0">bearing 042°</text>
</svg><figcaption>Fig. 6. Inline SVG, hard-coded black, one red and one blue element.</figcaption></figure>

<p>They camped by the stone that night and took the bearings again at sunrise.</p>`

const filterSVG = theme => {
  const fg = rgb(theme.fg), bg = rgb(theme.bg)
  const lin = (c, i) => `<feFunc${c} type="linear" slope="${(fg[i] - bg[i]) / 255}" intercept="${bg[i] / 255}"/>`
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="fx-recolour" color-interpolation-filters="sRGB">
    <feComponentTransfer><feFuncR type="table" tableValues="1 0"/><feFuncG type="table" tableValues="1 0"/><feFuncB type="table" tableValues="1 0"/></feComponentTransfer>
    <feColorMatrix type="hueRotate" values="180"/>
    <feComponentTransfer>${['R', 'G', 'B'].map(lin).join('')}</feComponentTransfer></filter></svg>`
}
function epubCSS(opt, theme) {
  const base = `html { font: 15px/1.5 Georgia, serif; } body { margin: 24px 28px; }
    figure { margin: 1em 0; text-align: center; } img { max-width: 100%; } figcaption { font-size: 12px; font-style: italic; }
    img.gaiji { height: 1em; vertical-align: -0.1em; }`
  if (opt === 'invert') {
    const fg = invertHex(theme.fg)
    return base + `html { color-scheme: only light; color: ${fg}; background: ${invertHex(theme.bg)}; }`
  }
  // reader.js getCSS, dark branch, without the media query wrapper
  const today = `html { color-scheme: dark; color: ${theme.fg}; }
    html, body { color: ${theme.fg} !important; background: none !important; }
    body * { color: inherit !important; border-color: currentColor !important; background-color: ${theme.bg} !important; }
    a:any-link { color: ${theme.link} !important; }`
  if (opt === 'today') return base + today
  const fixes = `img, svg { background-color: transparent !important; }`
  if (opt === 'recolour') return base + today + fixes + `img, svg:not([aria-hidden]) { filter: url(#fx-recolour); }`
  return base + today + fixes + `.fx-lineart { filter: url(#fx-recolour); } .fx-photo { filter: brightness(${S.dim / 100}); }
    svg:not([aria-hidden]) { filter: url(#fx-recolour); }`
}
// 32×32 check, after Chromium / Dark Reader (see 16's findings)
function classify(img) {
  if (img.classList.contains('gaiji') || img.getBoundingClientRect().height <= 1.5 * parseFloat(getComputedStyle(img).fontSize))
    return { cls: 'lineart', why: 'gaiji or ≤ 1.5em tall' }
  const c = document.createElement('canvas'); c.width = c.height = 32
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, 32, 32)
  let data
  try { data = ctx.getImageData(0, 0, 32, 32).data } catch (e) { return { cls: 'photo', why: 'canvas tainted: ' + e.name } }
  let transparent = 0, opaque = 0, lumSum = 0, light = 0, sat = 0; const buckets = new Set()
  for (let i = 0; i < data.length; i += 4) {
    const [r, g, b, a] = [data[i], data[i + 1], data[i + 2], data[i + 3]]
    if (a < 13) { transparent++; continue }
    opaque++
    const l = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; lumSum += l; if (l > 0.8) light++
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); if (mx > 0 && (mx - mn) / mx > 0.5 && l <= 0.8) sat++
    buckets.add((r >> 4) << 8 | (g >> 4) << 4 | b >> 4)
  }
  const f = { transparent: +(transparent / 1024).toFixed(2), meanLum: +(lumSum / opaque).toFixed(2), light: +(light / opaque).toFixed(2),
    buckets: buckets.size, satOfInk: +(sat / Math.max(1, opaque - light)).toFixed(2) }
  if (f.transparent >= 0.1) return f.meanLum < 0.5 ? { cls: 'lineart', why: 'transparent, dark ink', f } : { cls: 'keep', why: 'transparent, light ink', f }
  if (f.buckets <= 40 && f.light >= 0.5)
    return f.satOfInk > 0.5 ? { cls: 'chart', why: 'few saturated colours on light', f } : { cls: 'lineart', why: 'few colours, mostly light', f }
  return { cls: 'photo', why: 'many colours', f }
}
async function renderEPUB(opt, theme) {
  const b = await epubBlobs()
  const t0 = performance.now()
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>${epubCSS(opt, theme)}</style></head>
    <body>${opt === 'recolour' || opt === 'smart' ? filterSVG(theme) : ''}${chapter(b)}</body></html>`
  const frame = document.createElement('iframe')
  frame.src = URL.createObjectURL(new Blob([html], { type: 'text/html' }))
  if (opt === 'invert') frame.style.filter = 'invert(1) hue-rotate(180deg)'
  const loaded = new Promise(r => frame.onload = r)
  frame.dataset.opt = opt
  stats[opt] = { note: '' }
  frame.after_ = async () => {
    await loaded
    const doc = frame.contentDocument
    await Promise.all([...doc.images].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r })))
    if (opt === 'smart') {
      const decisions = []
      for (const img of doc.images) {
        await img.decode().catch(() => {})
        let d = classify(img), retried = 0
        // WebKit sometimes draws an iframe's image as fully transparent on the first try; retry after a frame
        while (d.f?.transparent === 1 && retried < 5) { await new Promise(r => requestAnimationFrame(r)); d = classify(img); retried++ }
        if (retried) d.retried = retried
        if (d.cls === 'chart') d = { ...d, cls: S.charts === 'recolour' ? 'lineart' : 'photo' }
        if (d.cls !== 'keep') img.classList.add('fx-' + d.cls)
        decisions.push({ file:Object.keys(b).find(k => b[k] === img.src), ...d })
      }
      stats[opt].images = decisions.map(({ file, cls, why, f, retried }) => ({ file, cls, why, retried, f }))
    }
    frame.style.height = doc.documentElement.scrollHeight + 'px'
    stats[opt].ms = +(performance.now() - t0).toFixed(1)
  }
  return frame
}

// ---------- UI ----------
function seg(key, entries, onPick) {
  return `<span><label class="k">${key}</label><span class="seg">${entries.map(([v, l]) =>
    `<button data-k="${key}" data-v="${v}" class="${String(S[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</span></span>`
}
function header() {
  document.querySelector('#bar').innerHTML = `<span class="tag">PROTOTYPE</span>
    ${seg('page', Object.entries(PAGES))}
    ${seg('theme', Object.entries(THEMES).map(([k, t]) => [k, t.label]))}
    ${seg('dim', [[100, '100%'], [85, '85%'], [80, '80%']])}
    ${seg('view', [['compare', 'Compare all'], ['single', 'One at a time']])}
    ${kind() === 'pdf' ? seg('outlines', [[false, 'Off'], [true, 'Show detected']]) : seg('charts', [['keep', 'Charts: keep'], ['recolour', 'Charts: recolour']])}`
}
const mockHTML = () => `
  <div class="mock"><h4>Option A · Aa popover row</h4>
    <div class="row grey"><span>Auto · Light · Dark</span></div>
    <div class="row grey"><span>A− &nbsp; 18 pt &nbsp; A+</span><span>One · Two</span></div>
    <div class="row grey"><span>● ● ● ● ● ● ● ● ●</span></div>
    <div class="row"><span>Images</span><span class="seg"><button>Original</button><button class="on">Smart</button><button>Invert</button></span></div>
  </div>
  <div class="mock"><h4>Option B · View menu only</h4>
    <div class="menu"><div class="grey">Theme ▸</div><div class="hl">Images in Dark Mode ▸</div>
    <div style="padding-left:24px">Original<br>✓ Smart<br>Invert</div><div class="grey">Single Page ⌥⌘1</div></div>
  </div>
  <div class="mock"><h4>Option C · no setting</h4><div class="grey">Smart always; the old Invert toggle goes.</div></div>`
function side() {
  const state = { ...S, kind: kind(), stats }
  document.querySelector('#side').innerHTML = `<pre>${JSON.stringify(state, null, 1)}</pre>${mockHTML()}`
}
let renderToken = 0
async function render() {
  const token = ++renderToken
  syncURL(); header()
  const keys = optKeys()
  if (!keys.includes(S.opt)) S.opt = keys[0]
  for (const k in stats) delete stats[k]
  const theme = THEMES[S.theme]
  const stage = document.querySelector('#stage')
  stage.className = S.view === 'single' ? 'single' : ''
  stage.replaceChildren()
  const show = S.view === 'single' ? [S.opt] : keys
  const afters = []
  for (const opt of show) {
    const [title, sub] = OPTIONS[kind()][opt]
    const tile = document.createElement('div'); tile.className = 'tile'
    tile.innerHTML = `<h3>${title}</h3><div class="sub">${sub}</div><div class="page" style="background:${theme.bg}"></div><div class="stats"></div>`
    stage.append(tile)
    const el = kind() === 'pdf' ? await renderPDF(opt, theme) : await renderEPUB(opt, theme)
    if (token !== renderToken) return
    tile.querySelector('.page').append(el)
    if (el.after_) afters.push(el.after_())
  }
  await Promise.all(afters)
  for (const tile of stage.children) {
    const opt = show[[...stage.children].indexOf(tile)], s = stats[opt]
    tile.querySelector('.stats').textContent = s.ms != null ? `${s.ms} ms${s.renderMs ? ` (+ ${s.renderMs} ms first render)` : ''}${s.note ? '\n' + s.note : ''}` : ''
  }
  const sw = document.querySelector('#switcher')
  sw.hidden = S.view !== 'single'
  sw.innerHTML = `<button data-step="-1">←</button><span>${keys.indexOf(S.opt) + 1}/${keys.length} · ${OPTIONS[kind()][S.opt][0]}</span><button data-step="1">→</button>`
  side()
  window.webkit?.messageHandlers?.done?.postMessage(1)
}
function step(d) { const keys = optKeys(); S.opt = keys[(keys.indexOf(S.opt) + d + keys.length) % keys.length]; render() }
function openLoupe(c) {
  const l = document.querySelector('#loupe'), copy = copyCanvas(c)
  copy.style.filter = c.style.filter
  l.innerHTML = '<div class="hint">Actual pixels · click to close · look for the halo round restored photos</div>'
  l.append(copy); l.hidden = false
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-k]')
  if (b) { const k = b.dataset.k, v = b.dataset.v; S[k] = k === 'dim' ? +v : k === 'outlines' ? v === 'true' : v; render(); return }
  const s = e.target.closest('[data-step]'); if (s) return step(+s.dataset.step)
  if (e.target.closest('#loupe')) document.querySelector('#loupe').hidden = true
})
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return
  if (e.key === 'Escape') document.querySelector('#loupe').hidden = true
  if (S.view !== 'single') return
  if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1)
})
render()
</script>
